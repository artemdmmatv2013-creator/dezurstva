<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дежурства — отметка</title>
<style>
  :root {
    --bg: #f4f6f8;
    --surface: #ffffff;
    --ink: #1e2430;
    --muted: #66707e;
    --line: #e2e7ee;
    --brand: #2f6fed;
    --brand-dark: #1f55c4;
    --brand-soft: #e8effc;
    --ok: #1f9e5f;
    --ok-soft: #e4f6ec;
    --danger: #c0392b;
    --shadow: 0 1px 3px rgba(20,30,50,.08), 0 6px 20px rgba(20,30,50,.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 80px; }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 16px 18px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: var(--shadow); margin-bottom: 16px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .logo {
    width: 40px; height: 40px; border-radius: 10px; background: var(--brand);
    display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 18px;
  }
  .brand h1 { margin: 0; font-size: 18px; font-weight: 700; }
  .brand p { margin: 0; font-size: 13px; color: var(--muted); }
  .header-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .sync-badge {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
    padding: 6px 11px; border-radius: 20px; background: var(--bg); color: var(--muted); border: 1px solid var(--line);
  }
  .sync-badge .dot { width: 9px; height: 9px; border-radius: 50%; background: #b9c3d1; }
  .sync-badge.on { background: var(--ok-soft); color: var(--ok); border-color: #bfe4cf; }
  .sync-badge.on .dot { background: var(--ok); }
  .sync-badge.err { background: #fbeaea; color: var(--danger); border-color: #eec7c1; }
  .sync-badge.err .dot { background: var(--danger); }
  .btn {
    appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    padding: 9px 13px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .btn:hover { border-color: #c9d3e0; background: #fafbfc; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { background: var(--brand-dark); }

  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: var(--shadow); overflow: hidden; margin-top: 16px;
  }
  .card-head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .card-head h2 { margin: 0; font-size: 16px; }
  .card-head .period { font-size: 13px; color: var(--muted); }

  .duty-row { display: flex; align-items: center; gap: 14px; padding: 13px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .duty-row:last-child { border-bottom: none; }
  .duty-row .name { flex: 1; font-weight: 600; font-size: 15px; min-width: 170px; }
  .duty-row .prof { font-size: 13px; color: var(--muted); font-weight: 400; display: block; }

  .checks { display: flex; gap: 7px; flex-wrap: wrap; }
  .check {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 7px; border: 2px solid #b9c3d1; cursor: pointer; background: var(--surface);
    transition: all .12s;
  }
  .check:hover { border-color: var(--brand); }
  .check.done { background: var(--ok); border-color: var(--ok); }
  .check svg { opacity: 0; transition: opacity .1s; }
  .check.done svg { opacity: 1; }

  .summary {
    margin-top: 16px; padding: 14px 18px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: var(--shadow); font-size: 14px; color: var(--muted);
    display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .summary b { color: var(--ink); font-size: 16px; }

  [hidden] { display: none !important; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(20,26,40,.5); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .modal { background: var(--surface); border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.25); width: 100%; max-width: 480px; max-height: 88vh; overflow: auto; padding: 22px; }
  .modal h3 { margin: 0 0 16px; font-size: 17px; }
  .modal .close-x { float: right; border: none; background: none; font-size: 22px; cursor: pointer; color: var(--muted); line-height: 1; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--muted); }
  .field input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; font-family: inherit; }
  .field input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(47,111,237,.12); }
  .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .inline-toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 10px; font-size: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,.2); z-index: 60; opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .inline-toast.show { opacity: 1; }
  .cloud-note { margin-top: 14px; padding: 12px 16px; border-radius: 12px; font-size: 13px; line-height: 1.5; background: var(--brand-soft); border: 1px solid #c9d9fa; color: var(--brand-dark); }
  .cloud-note.err { background: #fbeaea; border-color: #eec7c1; color: var(--danger); }

  @media (max-width: 480px) {
    header { flex-direction: column; align-items: stretch; }
    .duty-row { padding: 12px 14px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">Д</div>
      <div>
        <h1>Отметка дежурств</h1>
        <p id="classLabel">Класс не выбран</p>
      </div>
    </div>
    <div class="header-actions">
      <span class="sync-badge" id="syncBadge" title="Состояние синхронизации"><span class="dot"></span><span id="syncLabel">не подключено</span></span>
      <button class="btn" id="btnSettings">Настройки</button>
    </div>
  </header>

  <div class="card">
    <div class="card-head">
      <h2>Дежурные</h2>
      <span class="period">9 ноября 2026 — 31 мая 2027</span>
    </div>
    <div id="dutyList"></div>
    <div class="summary" style="margin:0;border-radius:0;box-shadow:none;border-top:1px solid var(--line);">
      <span>Отмечено дежурств: <b id="doneCount">0</b></span>
      <button class="btn" id="btnClearMarks">Сбросить отметки</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="settingsModal" hidden>
  <div class="modal">
    <button class="close-x" data-close>&times;</button>
    <h3>Настройки</h3>
    <div class="field">
      <label for="setClassName">Название класса</label>
      <input id="setClassName" type="text" placeholder="Например, 9 «Б»">
    </div>
    <hr style="border:none;border-top:1px solid var(--line);margin:16px 0;">
    <p style="margin:0 0 4px;font-size:14px;font-weight:700;">Синхронизация между устройствами</p>
    <p class="lbl" style="color:var(--muted);font-size:12.5px;margin:0 0 12px;">
      Вставьте данные своего проекта Supabase. Без них данные хранятся только на этом устройстве.
    </p>
    <div class="field">
      <label for="setSupabaseUrl">Project URL</label>
      <input id="setSupabaseUrl" type="text" placeholder="https://xxxx.supabase.co">
    </div>
    <div class="field">
      <label for="setSupabaseKey">anon / publishable key</label>
      <input id="setSupabaseKey" type="text" placeholder="eyJ... или sb_publishable_...">
    </div>
    <div class="cloud-note" id="cloudNote"></div>
    <div class="modal-footer">
      <button class="btn" data-close>Отмена</button>
      <button class="btn primary" id="btnSaveSettings">Сохранить</button>
    </div>
  </div>
</div>

<div class="inline-toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "dezurstva-cells-v1";
  var CFG_KEY = "dezurstva-cloud-v1";

  // Период: 9 ноября 2026 — 31 мая 2027, учебные дни пн–пт
  var PERIOD_START = "2026-11-09";
  var PERIOD_END = "2027-05-31";

  var state = { className: "", cells: {}, version: 1 };
  var CFG = { url: "", key: "" };

  var BASE_PAIRS = [
    "Фурсова Варвара, Коморова Виктория",
    "Кузнецов Илья, Соколов Сергей",
    "Соловьёв Вадим, Сайфидинов Кирилл",
    "Медведева Василиса, Кисилевич Олеся",
    "Пономарёва Валерия, Ворожцова Анна",
    "Степанова Дарья, Николаева Василиса, Смирнова Злата",
    "Иванов Алексей, Пантюхов Никита",
    "Матвеев Артём, Комолов Андрей",
    "Николаев Всеволод, Гусейнов Микаэль",
    "Антропов Макар, Ершов Павел",
    "Виноградова Нелли, Егорова Серафима"
  ];

  // Пара -> число дежурств за период (по кругу по учебным дням)
  function dutyCounts() {
    var nPairs = BASE_PAIRS.length;
    var total = 0;
    var d = new Date(PERIOD_START + "T00:00:00");
    var end = new Date(PERIOD_END + "T00:00:00");
    while (d <= end) {
      var wd = d.getDay();
      if (wd >= 1 && wd <= 5) total++;
      d.setDate(d.getDate() + 1);
    }
    var counts = new Array(nPairs).fill(0);
    for (var i = 0; i < total; i++) counts[i % nPairs]++;
    return counts;
  }

  function buildState() {
    var counts = dutyCounts();
    var cells = {};
    BASE_PAIRS.forEach(function (name, i) {
      for (var c = 0; c < counts[i]; c++) cells["d" + i + "-" + c] = false;
    });
    return { className: "", cells: cells, version: 1 };
  }

  // ---------- Local ----------
  function loadLocal() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) { var p = JSON.parse(raw); if (p && typeof p === "object") state = Object.assign(state, p); }
    } catch (e) {}
    try {
      var c = JSON.parse(localStorage.getItem(CFG_KEY) || "{}");
      if (c && typeof c.url === "string") CFG.url = c.url;
      if (c && typeof c.key === "string") CFG.key = c.key;
    } catch (e) {}
    // если нет данных или другая структура — пересоздаём
    if (!state.cells || Object.keys(state.cells).length === 0) state = buildState();
  }
  function saveLocal() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); localStorage.setItem(CFG_KEY, JSON.stringify(CFG)); } catch (e) {}
  }

  // ---------- Sync ----------
  function setSync(mode, label) {
    var badge = document.getElementById("syncBadge");
    var lbl = document.getElementById("syncLabel");
    badge.className = "sync-badge " + (mode === "on" ? "on" : mode === "err" ? "err" : "");
    lbl.textContent = label;
  }
  function cfgReady() {
    var url = CFG.url.replace(/\/+$/, "");
    return url.indexOf("supabase.co") !== -1 && CFG.key.length > 20;
  }
  function cloudFetch(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({
      "apikey": CFG.key, "Authorization": "Bearer " + CFG.key,
      "Content-Type": "application/json", "Prefer": "return=minimal"
    }, opts.headers || {});
    return fetch(CFG.url.replace(/\/+$/, "") + path, opts).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      var ct = r.headers.get("content-type") || "";
      return ct.indexOf("json") !== -1 ? r.json() : Promise.resolve(null);
    });
  }
  var pushTimer = null, pushing = false, pendingAfter = false;
  function schedulePush() { clearTimeout(pushTimer); pushTimer = setTimeout(pushNow, 400); }
  function pushNow() {
    if (!cfgReady() || pushing) { if (pushing) pendingAfter = true; return; }
    pushing = true; setSync("", "сохраняю…");
    var payload = JSON.parse(JSON.stringify(state));
    var body = { id: 0, payload: payload, updated_at: new Date().toISOString() };
    cloudFetch("/rest/v1/dezurstva_data", {
      method: "POST", headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify(body)
    }).then(function () {
      pushing = false; setSync("on", "облако: ОК");
      if (pendingAfter) { pendingAfter = false; pushNow(); }
    }).catch(function () { pushing = false; setSync("err", "ошибка сохранения"); });
  }
  function pullNow() {
    if (!cfgReady()) return Promise.reject(new Error("not configured"));
    setSync("", "загружаю…");
    return cloudFetch("/rest/v1/dezurstva_data?select=payload,updated_at&id=eq.0&limit=1")
      .then(function (rows) {
        if (rows && rows.length > 0 && rows[0].payload) {
          state = Object.assign(state, rows[0].payload);
          if (!state.cells || Object.keys(state.cells).length === 0) state = buildState();
          setSync("on", "облако: ОК"); render(); return true;
        }
        setSync("on", "облако: ОК"); return pushNow();
      })
      .catch(function () { setSync("err", "не удалось связаться с облаком"); throw new Error("cloud"); });
  }

  // ---------- Actions ----------
  function save() { saveLocal(); render(); schedulePush(); }

  function toggleCell(key) {
    state.cells[key] = !state.cells[key];
    save();
  }

  function render() {
    document.getElementById("classLabel").textContent = state.className || "Класс не выбран";
    var list = document.getElementById("dutyList");
    list.innerHTML = "";

    var doneN = 0;
    BASE_PAIRS.forEach(function (name, i) {
      for (var c = 0; c < 30; c++) {
        if (state.cells["d" + i + "-" + c]) doneN++;
      }
    });
    document.getElementById("doneCount").textContent = doneN;

    BASE_PAIRS.forEach(function (name, i) {
      var row = document.createElement("div");
      row.className = "duty-row";

      var nameWrap = document.createElement("div");
      nameWrap.className = "name";
      var cnt = dutyCounts()[i];
      nameWrap.innerHTML = '<span>' + name + '</span><span class="prof">' + cnt + ' дежурств</span>';

      var checks = document.createElement("div");
      checks.className = "checks";

      for (var c = 0; c < cnt; c++) {
        var key = "d" + i + "-" + c;
        var done = !!state.cells[key];
        var chk = document.createElement("span");
        chk.className = "check" + (done ? " done" : "");
        chk.setAttribute("role", "checkbox");
        chk.setAttribute("aria-checked", done ? "true" : "false");
        chk.setAttribute("aria-label", "Отметка " + (c + 1) + " — " + name);
        chk.tabIndex = 0;
        chk.innerHTML = '<svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="2.5,8.5 6.5,12.5 13.5,4"/></svg>';
        chk.addEventListener("click", function (k) { return function () { toggleCell(k); }; }(key));
        chk.addEventListener("keydown", function (k) { return function (ev) { if (ev.key === " " || ev.key === "Enter") { ev.preventDefault(); toggleCell(k); } }; }(key));
        checks.appendChild(chk);
      }

      row.appendChild(nameWrap); row.appendChild(checks);
      list.appendChild(row);
    });
  }

  function clearMarks() {
    Object.keys(state.cells).forEach(function (k) { state.cells[k] = false; });
    save();
    toast("Отметки сброшены");
  }

  // ---------- Settings ----------
  function cloudNoteHTML() {
    if (cfgReady()) return 'Синхронизация включена. Ключ виден всем, у кого есть страница, поэтому не храните в проекте ничего личного.';
    return 'Вставьте данные проекта Supabase (Project URL и ключ). Без этого данные только на этом устройстве.';
  }
  function refreshCloudNote() {
    var note = document.getElementById("cloudNote");
    note.className = "cloud-note" + (cfgReady() ? "" : " err");
    note.innerHTML = cloudNoteHTML();
  }
  function openSettings() {
    document.getElementById("setClassName").value = state.className;
    document.getElementById("setSupabaseUrl").value = CFG.url;
    document.getElementById("setSupabaseKey").value = CFG.key;
    refreshCloudNote();
    document.getElementById("settingsModal").hidden = false;
  }
  function saveSettings() {
    state.className = document.getElementById("setClassName").value.trim();
    CFG.url = document.getElementById("setSupabaseUrl").value.trim();
    CFG.key = document.getElementById("setSupabaseKey").value.trim();
    document.getElementById("settingsModal").hidden = true;
    saveLocal(); render();
    toast("Настройки сохранены");
    if (cfgReady()) pullNow().catch(function () {});
    else setSync("off", "не подключено");
  }

  var toastTimer;
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2000);
  }

  document.addEventListener("DOMContentLoaded", function () {
    loadLocal();
    render();
    if (cfgReady()) pullNow().catch(function () {});

    document.querySelectorAll("[data-close]").forEach(function (b) {
      b.addEventListener("click", function () { var m = b.closest(".modal-backdrop"); if (m) m.hidden = true; });
    });
    document.querySelectorAll(".modal-backdrop").forEach(function (backdrop) {
      backdrop.addEventListener("click", function (e) { if (e.target === backdrop) backdrop.hidden = true; });
    });

    document.getElementById("btnSettings").addEventListener("click", openSettings);
    document.getElementById("btnSaveSettings").addEventListener("click", saveSettings);
    document.getElementById("btnClearMarks").addEventListener("click", function () {
      if (confirm("Сбросить все отметки?")) clearMarks();
    });

    setInterval(function () { if (cfgReady() && !pushing) pullNow().catch(function () {}); }, 8000);
  });
})();
</script>
</body>
</html>
